name: Build Debug APK
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1.Gradle运行环境：JDK11（AGP7.2.1强制）
      - name: Setup JDK11 for Gradle runtime
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # 2.额外安装JDK8，用于编译Android源码
      - name: Install JDK8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      # 打印环境调试，看JDK实际路径
      - name: Print java versions
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          update-java-alternatives -l

      # 安装旧版android sdk cmdline‑tools‑8
      - name: Install Android SDK cmdline‑tools 8
        run: |
          mkdir -p ~/android-sdk/cmdline-tools
          cd ~/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-8092744_latest.zip
          unzip -q commandlinetools-linux-8092744_latest.zip
          mv cmdline-tools latest
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV

      - name: Accept SDK licenses
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Install SDK components
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-28" "build-tools;28.0.3"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 核心：JAVA_HOME=JDK11跑Gradle，编译java指定JDK8路径
      - name: Assemble Debug APK
        run: |
          JDK8_PATH=$(update-java-alternatives -l | grep -E 'java-1.8.0|temurin-8' | awk '{print $3}')
          echo "JDK8_PATH=$JDK8_PATH"
          ./gradlew assembleDebug -Dorg.gradle.java.home="${JDK8_PATH}"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
