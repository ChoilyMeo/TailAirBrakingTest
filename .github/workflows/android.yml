name: Build Debug APK
on:
  push:
    branches: [ master ]  # 如果你的主分支是 master，请改成 master
  workflow_dispatch:    # GitHub网页上可以手动点击触发打包

jobs:
  build_debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # compileSdk28 老项目必须 JDK8
      - name: Setup JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: gradle

      # 安装项目指定 NDK 21.0.6113669，jniLibs 编译依赖
      - name: Install Android NDK 21.0.6113669
        uses: android-actions/setup-android-ndk@v1
        with:
          ndk-version: '21.0.6113669'

      # 赋予gradlew执行权限（Ubuntu必须）
      - name: Grant gradlew execute permission
        run: chmod +x ./gradlew

      # 只构建Debug，自动执行greendao生成dao代码、自动拆分abi包
      - name: Run assembleDebug
        run: ./gradlew assembleDebug

      # 上传所有ABI分包Debug APK作为制品，可以网页下载
      - name: Upload Debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-all-abi
          path: app/build/outputs/apk/debug/*.APK
