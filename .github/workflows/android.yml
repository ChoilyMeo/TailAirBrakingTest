name: Build Debug APK
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 设置 JDK 11 (足以兼容 AGP 7.x 并编译你的项目)
      - name: Setup JDK11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # 安装 build.gradle 中强制要求的 SDK 和 NDK 组件
      - name: Install SDK and NDK components
        run: |
          # 使用 runner 自带的 sdkmanager
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          # 安装 compileSdk 和 build-tools
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-28" "build-tools;28.0.3"
          # 关键：安装 build.gradle 中指定的 NDK 版本
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;21.0.6113669"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 编译 APK
      - name: Assemble Debug APK
        run: ./gradlew assembleDebug

      # 上传产物 (注意这里改成了 *.APK，与你 build.gradle 中的大写后缀匹配)
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.APK
