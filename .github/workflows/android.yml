name: Build Debug APK
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Gradle运行器：JDK11（给gradle工具本身跑）
      - name: Setup JDK 11 for Gradle runtime
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # 额外安装 JDK8，用于Android编译
      - name: Setup JDK8 for Android compile
        uses: actions/setup-java@v4
        id: jdk8
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Install Android SDK cmdline‑tools 8
        run: |
          mkdir -p ~/android-sdk/cmdline-tools
          cd ~/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-8092744_latest.zip
          unzip -q commandlinetools-linux-8092744_latest.zip
          mv cmdline-tools latest
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV

      - name: Accept SDK licenses
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Install SDK components
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-28" "build-tools;28.0.3"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 关键：给gradle指定编译用JDK8，JAVA_HOME仍然是11用于启动Gradle
      - name: Assemble Debug APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.java.home=${{ steps.jdk8.outputs.java-home }}"
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
