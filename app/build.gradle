apply plugin: 'com.android.application'
apply plugin: 'org.greenrobot.greendao'//add greendao plugin

android {
    compileSdkVersion 28
    defaultConfig {
        applicationId "com.thnet.tailairbrakingtest"
        minSdkVersion 23
        targetSdkVersion 28
        versionCode 8
        versionName "1.0.1.8"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags ""
                //生成多个版本的so文件
                abiFilters "armeabi-v7a","x86_64","x86"
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            buildConfigField "boolean", "USE_LOCAL_TEST_DATA", "false"
            buildConfigField "boolean", "CONTROL_RF433_POWER_OFF", "false"
        }
        debug {
            buildConfigField "boolean", "USE_LOCAL_TEST_DATA", "true"
            buildConfigField "boolean", "CONTROL_RF433_POWER_OFF", "false"
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
    sourceSets {
        main {
            jni.srcDirs = ['src/main/jni', 'src/main/cpp/']
        }
    }
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a','x86_64','x86'
            universalApk false
        }
    }
    ndkVersion = '21.0.6113669'
    android.applicationVariants.all {
        variant ->
            variant.outputs.all {
                output ->
                    def abiName = output.getFilter(com.android.build.OutputFile.ABI)
                    output.outputFileName = "lwsf_V${variant.versionName}_${abiName}_${variant.buildType.name}.APK"
            }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'com.android.support.constraint:constraint-layout:1.1.3'
    implementation 'com.android.support:design:28.0.0'
    implementation 'org.greenrobot:greendao:3.2.2'//add greendao plugin
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'
    implementation 'com.android.support:design:28.0.0'
    implementation 'com.elvishew:xlog:1.6.1'
    implementation 'com.android.support:support-annotations:28.0.0'
}

greendao {
    schemaVersion 1000
    daoPackage 'com.thnet.tailairbrakingtest.dao'
    targetGenDir 'src/main/java'
}
